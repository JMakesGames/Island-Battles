<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Island Battles</title>
    <style>
      /* ---- Island Battles — a hand-inked, medieval-manuscript UI theme ----
         Everything the player reads sits on aged parchment inside dark-oak
         frames with a thin band of gilt, and every button is a carved wood
         tablet. The palette below is the whole game's vocabulary; the DOM HUD
         (src/ui/*) draws from these same colours so nothing looks like a
         generic dark-mode app anymore. */
      :root {
        color-scheme: light;
        --parch-1: #efe3c4;   /* lit parchment      */
        --parch-2: #e2cfa2;   /* parchment midtone  */
        --parch-3: #d3ba85;   /* parchment in shade */
        --ink:     #2c1e0d;   /* iron-gall ink      */
        --ink-soft:#5a4426;   /* faded ink          */
        --oak:     #5a3b1e;   /* oak frame          */
        --oak-dk:  #38240f;   /* deep oak / border  */
        --oak-lt:  #7c5227;   /* lit oak            */
        --gilt:    #a9781f;   /* gold leaf          */
        --gilt-lt: #d8b24c;   /* bright gilt        */
        --royal:   #7c2118;   /* heraldic red       */
        --royal-lt:#a8352a;
        --forest:  #40602e;   /* banner green       */
        --stone:   #7d746a;   /* worn stone         */
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        background:
          radial-gradient(120% 100% at 50% 0%, #2a1c0e 0%, #170f06 70%, #0d0803 100%);
        color: var(--ink);
        font: 15px/1.45 "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, "Times New Roman", serif;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
      #game { position: fixed; inset: 0; }
      #game canvas { display: block; width: 100%; height: 100%; cursor: crosshair; image-rendering: pixelated; }

      /* Every HUD/menu button is a carved wood tablet: warm oak gradient, a
         lit top edge and a shadowed base so it reads as a raised, physical
         thing you press. Individual buttons still set their own background /
         colour to signal state (affordable, owned, at-war…); this only lays
         down the shared "carving", typography and press feel underneath. */
      #game button {
        font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
        font-weight: 600;
        letter-spacing: 0.02em;
        border-radius: 3px;
        color: #f3e6c4;
        text-shadow: 0 1px 1px rgba(0,0,0,0.5);
        box-shadow:
          inset 0 1px 0 rgba(255,225,165,0.35),
          inset 0 -3px 5px rgba(0,0,0,0.4),
          0 2px 3px rgba(0,0,0,0.45);
        transition: filter .1s ease, transform .05s ease;
      }
      #game button:hover { filter: brightness(1.12) saturate(1.05); }
      #game button:active { transform: translateY(1px); filter: brightness(0.95); }
      #game button:disabled { cursor: default; filter: grayscale(0.45) brightness(0.82); opacity: 0.8; }

      /* Aged-brass scrollbars on a dark-oak channel. */
      #game ::-webkit-scrollbar { width: 12px; height: 12px; }
      #game ::-webkit-scrollbar-track { background: rgba(40,26,12,0.55); border-radius: 0; }
      #game ::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, var(--oak-lt), var(--oak-dk));
        border: 2px solid rgba(20,12,4,0.8);
        border-radius: 3px;
      }
      #game ::-webkit-scrollbar-thumb:hover { background: linear-gradient(180deg, var(--gilt), var(--oak)); }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
